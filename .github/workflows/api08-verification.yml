name: API 08 verification

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Django + MySQL API 08
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jns_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DB_ENGINE: mysql
      DB_NAME: jns_ci
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: application/django/requirements.txt

      - name: Install MySQL build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r application/django/requirements.txt

      - name: Django system check
        working-directory: application/django
        run: python manage.py check

      - name: Run API 08 integration tests
        working-directory: application/django
        run: python manage.py test tasks.api.test_task_update --verbosity 2

  frontend:
    name: React build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: presentation/react/package-lock.json

      - name: Install frontend dependencies
        working-directory: presentation/react
        run: npm ci

      - name: Build React app
        working-directory: presentation/react
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
        run: npm run build
