name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  django:
    name: Django tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jns_task_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: application/django

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        env:
          DB_ENGINE: mysql
          DB_NAME: jns_task_management_test
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-secret-key
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test

  react:
    name: React build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: presentation/react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: presentation/react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
